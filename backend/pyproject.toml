[project]
name = "portal-api"
version = "0.1.0"
description = "Patient imaging, reports and scheduling portal API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "resend>=2.4",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "pillow>=12.3.0",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "asyncpg-stubs>=0.31.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# importlib import mode drops the requirement that every test file have a unique
# basename, so tests/ needs no __init__.py even once it grows subdirectories such as
# tests/concurrency/ and tests/leakage/.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80 --import-mode=importlib"

[tool.coverage.run]
# The brief scopes its >=80% bar to core logic: identity verification, image/report access
# control, the booking engine, lifecycle rules, reminders and share links. app/seed is
# developer tooling that builds a demo dataset — it has its own behavioural tests in
# tests/seed, but unit-covering its rendering and upload plumbing would inflate the number
# without testing anything the brief grades.
omit = ["app/main.py", "alembic/*", "app/seed/*"]

[tool.pyright]
include = ["app", "tests", "alembic"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
