# Local Postgres for running the test suite (including the concurrency test) without
# reaching the hosted Supabase database. Application dev and the deployed app both
# point at Supabase; only tests use this.
services:
  postgres:
    image: postgres:17-alpine
    container_name: portal-test-db
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      # Tests run against a throwaway database; keeping it in memory makes the
      # repeated schema setup the concurrency tests need noticeably faster.
      - /var/lib/postgresql/data
